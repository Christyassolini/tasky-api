<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/login.css">
    <link rel="stylesheet" href="./css/toast.css">
    <script src="./js/toast.js" defer></script>
    <script src="./js/login.js" defer></script>
    <script>
        // se já existe token, manda direto para a lista
        if (localStorage.getItem('token')) {
            window.location.href = './tarefa.html';
        }
    </script>
    <title>Login Tasky</title>
</head>

<body>

    <!--=============== Login ===============-->

    <main class="login-container active" id="login-container">
        <section class="container">
            <div class="content">
                <div class="title">
                    <h1>Login</h1>
                    <p>Faça seu Login</p>
                </div>
                <div class="input-section">
                    <div class="input-group">
                        <input type="email" id="email-login" class="input-field" placeholder=" " required>
                        <label for="email-login" class="floating-label">Email</label>
                    </div>
                    <div class="input-group">
                        <input type="password" id="senha-login" class="input-field" placeholder=" " required>
                        <label for="senha-login" class="floating-label">Senha</label>
                    </div>
                </div>
                <div class="checkbox-group">
                    <div class="checkbox-field">
                        <div>
                            <input type="checkbox" class="checkbox">
                        </div>
                        <div>
                            <p>Lembrar de mim</p>
                        </div>
                    </div>
                </div>
                <div class="submit">
                    <button class="btn-submit" onclick="validarLogin()">Entrar</button>
                    <p>Ainda não possui uma conta? <a href="" class="cadastrar-se"
                            onclick="mostrarCadastro(); return false">Cadastrar-se</a></p>
                </div>
        </section>
        </div>
    </main>

    <!--=============== Cadastro ===============-->

    <main class="cadastro-container" id="cadastro-container">
        <section class="container">
            <div class="content">
                <div class="title">
                    <h1>Cadastro</h1>
                    <p>Faça seu Cadastro</p>
                </div>
                <div class="input-section">
                    <div class="input-group">
                        <input type="text" id="nome-cadastro" class="input-field" placeholder=" " required>
                        <label for="nome-cadastro" class="floating-label">Nome completo</label>
                    </div>
                    <div class="input-group">
                        <input type="email" id="email-cadastro" class="input-field" placeholder=" " required>
                        <label for="email-cadastro" class="floating-label">Email</label>
                    </div>
                    <div class="input-group">
                        <input type="password" id="senha-cadastro" class="input-field" placeholder=" " required>
                        <label for="senha-cadastro" class="floating-label">Senha</label>
                    </div>
                    <div class="input-group">
                        <input type="password" id="confirmar-senha-cadastro" class="input-field" placeholder=" "
                            required>
                        <label for="confirmar-senha-cadastro" class="floating-label">Confirmar senha</label>
                    </div>
                </div>
                <div class="submit">
                    <button class="btn-submit" onclick="validarCadastro()">Cadastrar-se</button>
                    <p>Já possui uma conta? <a href="" onclick="mostrarLogin(); return false">Entrar</a></p>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
