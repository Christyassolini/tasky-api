<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/cadastrar-tarefa.css">
    <link rel="stylesheet" href="./css/toast.css">
    <script src="js/toast.js" defer></script>
    <title>Lista de Tarefas</title>
</head>

<body>
    <!-- ================ Header ================ -->

    <header class="header">
        <div class="content-header">
            <div class="logo">
                <img src="./img/logo.png" alt="Logo">
            </div>
            <div class="nav">
                <a href="#" onclick="logout(); return false"><span>Log Out</span></a>
            </div>
        </div>
    </header>

    <!-- ================ Cadastro ================ -->

    <main class="container">
        <section class="cadastro-container">
            <div class="container-title">
                <div class="titulo-cadastre">
                    <div class="back">
                        <a href="./tarefa.html"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                viewBox="0 0 24 24" fill="none" stroke="#43464e" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="lucide lucide-arrow-big-left-icon lucide-arrow-big-left">
                                <path
                                    d="M13 9a1 1 0 0 1-1-1V5.061a1 1 0 0 0-1.811-.75l-6.835 6.836a1.207 1.207 0 0 0 0 1.707l6.835 6.835a1 1 0 0 0 1.811-.75V16a1 1 0 0 1 1-1h6a1 1 0 0 0 1-1v-4a1 1 0 0 0-1-1z" />
                            </svg></a>
                    </div>
                    <div class="title">
                        <h1>Cadastre uma tarefa</h1>
                    </div>
                </div>
            </div>
            <div class="form">
                <div class="nome-titulo">
                    <label for="title">Título</label><br>
                    <input type="text" class="title" id="title" placeholder="Tarefa-01"><br>
                </div>
                <div class="desc">
                    <label for="desc">Descrição</label><br>
                    <textarea name="desc" id="desc" placeholder="Descreva sua tarefa..." cols="70" maxlength="500"
                        rows="10"
                        oninput="document.querySelector('.contador').textContent = this.value.length + ' / 500 caracteres'"></textarea><br>
                    <output>
                        <p class="contador">0 / 500 caracteres</p>
                    </output>
                </div>
                <div class="alteracoes">
                    <div class="cancelar">
                        <button type="button" onclick="cancelar()">Cancelar</button>
                    </div>
                    <div class="salvar">
                        <button type="button" onclick="salvarTarefa()">Salvar</button>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer class="container-footer">
        <div class="title-footer">
            <h1>Copyrith &copy 2026 <a href="https://christyassolini.github.io/Portif-lio/">Christyan Assolini</a>. Todos os direitos reservados.</h1>
        </div>
    </footer>
    <script src="./js/cadastrar-tarefa.js"></script>
</body>
